[Detection]
SuspiciousDLLs = speedhack.dll, inject.dll, hook.dll
SuspiciousProcesses = cheatengine.exe, CheatEngine.exe, ollydbg.exe, x64dbg.exe, x32dbg.exe, ida.exe, ida64.exe

[Files]
LogFilePath = anticheat.log
MainExePath = main.exe
SettingsPath = settings.ini

[Intervals]
ChecksumCheckInterval = 2000
MemoryCheckInterval = 500
ProcessCheckInterval = 1000

